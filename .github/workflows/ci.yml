name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new push lands on the same branch; the
# old run is already obsolete by the time we look at it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. The job only needs to read the repo for the
# checkout + scan, and the artefact upload uses the standard action
# without extra scopes.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (with a version comment) so a
# moved tag can't change what runs on the runner, and the runner is pinned to
# ubuntu-24.04 rather than -latest so a silent image migration can't break the
# jobs. Same versions as the CodeQL workflow and the main SpaceUX repo.

jobs:
  # gitleaks scans the full history for accidental secrets (API keys,
  # tokens, credentials). Run the CLI directly instead of going through
  # gitleaks/gitleaks-action@v2; that action still ships Node 20 which
  # GitHub is deprecating, and direct invocation drops a third-party
  # supply-chain dependency at the same time. Same ruleset, same result.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    # Pin gitleaks so a surprise upstream change can't break or relax CI.
    # Bump deliberately by checking the latest release and updating here.
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history needed so gitleaks can scan every commit, not
          # just the most recent tree.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${BASE}/${TARBALL}" -o "${TARBALL}"
          curl -sSLf "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Verify the pinned tarball against the published sha256 before
          # extracting; closes the supply-chain gap of pulling a
          # pinned-but-unverified binary.
          grep "  ${TARBALL}$" checksums.txt | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "${TARBALL}" gitleaks
          gitleaks version
      - name: Scan
        # --redact masks any finding in the report (safe to read on a public log).
        # --report-format sarif produces a SARIF report that the next step
        # uploads as a plain workflow artefact (not a Security > Code
        # scanning entry; that path would need codeql-action/upload-sarif
        # and security-events: write permissions).
        # No custom config: CI uses the upstream default ruleset.
        run: |
          gitleaks git . \
            --redact \
            --no-banner \
            --verbose \
            --report-format sarif \
            --report-path gitleaks.sarif
      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results.sarif
          path: gitleaks.sarif

  # Refuse compiled / opaque binary artefacts in the tree. Plugins are source
  # only (JSON manifests + JS); a committed ELF, shared library, object file or
  # Python/Java bytecode is either an accident or a way to smuggle code past
  # review, so fail on it. Images report as image/* and are kept.
  no-binaries:
    name: no binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Reject tracked compiled artefacts
        run: |
          fail=0
          # By content: executables, shared libraries, object files.
          mapfile -t bymime < <(
            git ls-files -z | xargs -0 file --mime-type 2>/dev/null \
              | grep -E ': application/x-(executable|pie-executable|sharedlib|object)$' || true
          )
          # By extension: bytecode and native libs that `file` can misclassify.
          # NUL-delimited so a path containing a newline can't corrupt the list.
          mapfile -d '' -t byext < <(
            git ls-files -z '*.pyc' '*.pyo' '*.so' '*.o' '*.a' '*.dll' '*.dylib' '*.exe' '*.class' '*.wasm' || true
          )
          if (( ${#bymime[@]} > 0 )); then
            echo 'Tracked binary files (by content):'
            printf '  %s\n' "${bymime[@]}"
            fail=1
          fi
          if (( ${#byext[@]} > 0 )); then
            echo 'Tracked compiled artefacts (by extension):'
            printf '  %s\n' "${byext[@]}"
            fail=1
          fi
          if (( fail )); then
            echo 'Compiled artefacts do not belong in the plugins repo.'
            exit 1
          fi
          echo 'No binary artefacts tracked.'

  # Validate every plugin manifest (valid JSON, kind matches its folder, unique
  # reverse-DNS id, semver, kind-specific payload) so a malformed or mislabelled
  # plugin fails here rather than at load time in the app. The validator uses
  # only Node built-ins, so there is nothing to install or audit.
  manifest-validation:
    name: manifest validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: node scripts/validate-plugins.mjs

  # Scan plugin JavaScript for disallowed patterns (dynamic code execution
  # anywhere; child_process in a non-function plugin) and print an advisory list
  # of high-privilege calls (network, child_process in function plugins) for the
  # reviewer. A coarse, dependency-free line scan; the runtime capability model
  # is the real enforcement (see the tracking issue).
  code-scan:
    name: code scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: node scripts/scan-plugin-code.mjs
